name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here — package.json's `packageManager` field is the
      # single source of truth, and specifying both is a hard error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      # 70 tests, offline and deterministic: fixtures are recorded real chain
      # data, so this never depends on the network or on someone else's wallet.
      - run: pnpm test
